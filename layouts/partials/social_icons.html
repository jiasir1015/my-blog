<div class="social-icons">
    <!-- 1. 输出 hugo.toml 里配置的普通图标 (比如 GitHub) -->
    {{- range .Site.Params.socialIcons -}}
    <a class="{{ .name }}" target="_blank" rel="noopener noreferrer me" href="{{ .url | safeURL }}">
        <span class="icon">
            {{- partial "svg.html" . }}
        </span>
        <label>{{ .name }}</label>
    </a>
    {{- end -}}

    <!-- ============================================ -->
    <!-- 2. 自定义 Email (悬浮显示，不跳转) -->
    <!-- ============================================ -->
    <div class="social-custom-btn email-btn-wrapper">
        <span class="icon">
            <!-- ⬇️ 这是一个标准的线条风格信封图标 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </span>
        <!-- 悬浮显示的文字 -->
        <div class="email-tooltip">
            j8465383071@163.com
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 3. 自定义 WeChat (点击弹窗) -->
    <!-- ============================================ -->
    <div class="social-custom-btn" onclick="openWeChatModal()">
        <span class="icon">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <path d="M8.27,3.5c-4.43,0-8.02,3.34-8.02,7.45c0,2.37,1.2,4.48,3.04,5.87c-0.27,0.92-0.87,2.23-1,2.57 c-0.12,0.3,0.11,0.52,0.42,0.35c0.47-0.25,2.46-1.37,3.39-1.97c0.69,0.19,1.42,0.3,2.17,0.3c4.43,0,8.02-3.34,8.02-7.45 S12.7,3.5,8.27,3.5z M19.43,10.6c-0.6,0-1.11,0.06-1.6,0.16c0.55,0.78,0.88,1.72,0.88,2.74c0,3.39-3.26,6.13-7.29,6.13 c-0.34,0-0.67-0.02-1-0.07c1.33,1.35,3.46,2.23,5.84,2.23c0.7,0,1.38-0.08,2.02-0.23c0.88,0.56,2.75,1.6,3.19,1.84 c0.29,0.16,0.5,0.05,0.39-0.23c-0.12-0.32-0.68-1.54-0.94-2.4c1.72-1.3,2.84-3.27,2.84-5.48C23.83,12.78,21.86,10.6,19.43,10.6z"></path>
            </svg>
        </span>
    </div>
</div>

<!-- ================= WeChat 弹窗结构 ================= -->
<div id="wechat-modal" class="wechat-modal">
    <div class="wechat-modal-content">
        <span class="wechat-close" onclick="closeWeChatModal()">&times;</span>
        
        <!-- 顶部 Tab 切换 -->
        <div class="wechat-tabs">
            <div class="wechat-tab active" onclick="switchWeChatTab('friend')">加好友 🤝</div>
            <div class="wechat-tab" onclick="switchWeChatTab('pay')">打赏 💰</div>
        </div>

        <!-- 内容区域 1: 加好友 -->
        <div id="tab-friend" class="wechat-tab-content active">
            <img src="/images/wechat_friend.jpg" alt="WeChat Friend QR">
            <p class="wechat-desc">注明来源与意图哦</p>
        </div>

        <!-- 内容区域 2: 打赏 -->
        <div id="tab-pay" class="wechat-tab-content">
            <img src="/images/wechat_pay.jpg" alt="WeChat Pay QR">
            <p class="wechat-desc">谢谢老板 💰</p>
        </div>
    </div>
</div>
