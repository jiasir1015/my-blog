<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>

<script>

const catPhotos = [
    { src: "/cats/cat1.jpg", desc: "No.1: 这是小猫吗 ❓" },
    { src: "/cats/cat2.jpg", desc: "No.2: 虚空摸🐱 " },
    { src: "/cats/cat3.jpg", desc: "No.3: 我妈说我不是傻子 🤤" },
    { src: "/cats/cat4.jpg", desc: "No.4: 喝点泔水怎么了 😠" },
    { src: "/cats/cat5.jpg", desc: "No.5: 我要抱抱 😳" },
    { src: "/cats/cat6.jpg", desc: "No.6: 你脸上怎么长了个手机 📱" },
    
];

let currentCatIndex = 0;
const modal = document.getElementById("cat-modal");
const widget = document.getElementById("cat-widget");
const catImg = document.getElementById("cat-img");
const catCaption = document.getElementById("cat-caption");
const closeBtn = document.getElementsByClassName("cat-close")[0];


widget.onclick = function() {
    modal.style.display = "block";
    showCat(currentCatIndex);
}


closeBtn.onclick = function() {
    modal.style.display = "none";
}


window.onclick = function(event) {
    if (event.target == modal) {
        modal.style.display = "none";
    }
}


document.onkeydown = function(e) {
    if (modal.style.display === "block") {
        if (e.key === "Escape") modal.style.display = "none";
        if (e.key === "ArrowLeft") changeCat(-1);
        if (e.key === "ArrowRight") changeCat(1);
    }
}


function changeCat(n) {
    showCat(currentCatIndex += n);
}

function showCat(n) {
    if (n >= catPhotos.length) { currentCatIndex = 0 }
    if (n < 0) { currentCatIndex = catPhotos.length - 1 }
    
    
    catImg.src = catPhotos[currentCatIndex].src;
    catCaption.innerText = catPhotos[currentCatIndex].desc;
}
</script>


<script>

function openWeChatModal() {
    document.getElementById('wechat-modal').style.display = 'block';
}

function closeWeChatModal() {
    document.getElementById('wechat-modal').style.display = 'none';
}


window.onclick = function(event) {
    const modal = document.getElementById('wechat-modal');
    if (event.target == modal) {
        modal.style.display = 'none';
    }
}


function switchWeChatTab(tabName) {
    
    const tabs = document.querySelectorAll('.wechat-tab');
    tabs.forEach(tab => tab.classList.remove('active'));
    
    if(tabName === 'friend') tabs[0].classList.add('active');
    else tabs[1].classList.add('active');

    
    document.querySelectorAll('.wechat-tab-content').forEach(content => {
        content.classList.remove('active');
    });
    document.getElementById('tab-' + tabName).classList.add('active');
}
</script>
