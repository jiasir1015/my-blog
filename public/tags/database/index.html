<script>

const catPhotos = [
    { src: "/cats/cat1.jpg", desc: "No.1: 这是小猫吗 ❓" },
    { src: "/cats/cat2.jpg", desc: "No.2: 虚空摸🐱 " },
    { src: "/cats/cat3.jpg", desc: "No.3: 我妈说我不是傻子 🤤" },
    { src: "/cats/cat4.jpg", desc: "No.4: 喝点泔水怎么了 😠" },
    { src: "/cats/cat5.jpg", desc: "No.5: 我要抱抱 😳" },
    { src: "/cats/cat6.jpg", desc: "No.6: 你脸上怎么长了个手机 📱" },
    
];

let currentCatIndex = 0;
const modal = document.getElementById("cat-modal");
const widget = document.getElementById("cat-widget");
const catImg = document.getElementById("cat-img");
const catCaption = document.getElementById("cat-caption");
const closeBtn = document.getElementsByClassName("cat-close")[0];


widget.onclick = function() {
    
    modal.style.display = "flex"; 
    showCat(currentCatIndex);
}


closeBtn.onclick = function() {
    modal.style.display = "none";
}


window.onclick = function(event) {
    if (event.target == modal) {
        modal.style.display = "none";
    }
}


document.onkeydown = function(e) {
    if (modal.style.display === "flex") {
        if (e.key === "Escape") modal.style.display = "none";
        if (e.key === "ArrowLeft") changeCat(-1);
        if (e.key === "ArrowRight") changeCat(1);
    }
}


function changeCat(n) {
    showCat(currentCatIndex += n);
}

function showCat(n) {
    if (n >= catPhotos.length) { currentCatIndex = 0 }
    if (n < 0) { currentCatIndex = catPhotos.length - 1 }
    
    
    catImg.src = catPhotos[currentCatIndex].src;
    catCaption.innerText = catPhotos[currentCatIndex].desc;
}
</script>

    const tabs = document.querySelectorAll('.wechat-tab');
    tabs.forEach(tab => tab.classList.remove('active'));

<script src="https://unpkg.com/codeflask/build/codeflask.min.js"></script>

<script>
 
const MY_LEETCODE_USERNAME = "hashmpa"; 

let lcDataGlobal = null;
let flaskEditor = null;
const STORAGE_KEY_LAST_DATE = 'lc_cn_last_solved_date'; 
const STORAGE_KEY_STREAK = 'lc_cn_streak_count';

document.addEventListener("DOMContentLoaded", function() {
    initLeetCodeWidget();
});

document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === 'visible' && document.getElementById('lc-modal').style.display === 'block') {
        console.log("Checking submission status...");
        checkSubmissionStatus(true); 
    }
});

function initLeetCodeWidget() {
    const lcWidget = document.getElementById('leetcode-widget');
    if (!lcWidget) return;

    updateStreakDisplay();

    const PROXY_URL = 'https://corsproxy.io/?'; 
    const TARGET_URL = 'https://leetcode.cn/graphql';
    
    const query = `
    query questionOfToday {
        todayRecord {
            date
            question {
                questionFrontendId
                titleSlug
                translatedTitle 
                difficulty
                translatedContent
                topicTags { translatedName }
                codeSnippets { langSlug code }
            }
        }
    }`;

    fetch(PROXY_URL + encodeURIComponent(TARGET_URL), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
    })
    .then(response => response.json())
    .then(result => {
        const record = result.data.todayRecord[0];
        if (!record) throw new Error("Empty data");
        
        lcDataGlobal = {
            date: record.date,
            titleSlug: record.question.titleSlug, 
            link: `/problems/${record.question.titleSlug}/description/`,
            title: record.question.translatedTitle,
            difficulty: record.question.difficulty,
            content: record.question.translatedContent,
            snippets: record.question.codeSnippets
        };

        document.querySelector('.leetcode-loading').style.display = 'none';
        document.querySelector('.leetcode-content').style.display = 'block';

        const lastSolved = localStorage.getItem(STORAGE_KEY_LAST_DATE);
        if (lastSolved === record.date) {
            showSolvedState();
        } else {
            document.getElementById('lc-state-todo').style.display = 'block';
            document.getElementById('lc-date').innerText = record.date;
            document.getElementById('lc-title').innerText = `${record.question.questionFrontendId}. ${record.question.translatedTitle}`;
            document.getElementById('lc-link').href = "https://leetcode.cn" + lcDataGlobal.link;
            
            const diffEl = document.getElementById('lc-difficulty');
            const diffMap = { 'Easy': '简单', 'Medium': '中等', 'Hard': '困难' };
            diffEl.innerText = diffMap[record.question.difficulty] || record.question.difficulty;
            diffEl.className = `lc-difficulty diff-${record.question.difficulty.toLowerCase()}`;
        }
    })
    .catch(err => {
        console.error("Init Error:", err);
    });
}


function checkSubmissionStatus(isSilent = false) {
    if (!lcDataGlobal) return;
    
    const PROXY_URL = 'https://corsproxy.io/?'; 
    const TARGET_URL = 'https://leetcode.cn/graphql';

    const query = `
    query recentSubmissions($userSlug: String!) {
        recentSubmissions(userSlug: $userSlug) {
            status
            question {
                titleSlug
            }
            submitTime
        }
    }`;

    const checkBtn = document.getElementById('btn-check-status');
    if(checkBtn) {
        checkBtn.innerText = "⏳ Verifying...";
        checkBtn.disabled = true;
    }

    fetch(PROXY_URL + encodeURIComponent(TARGET_URL), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            query: query,
            variables: { userSlug: MY_LEETCODE_USERNAME }
        })
    })
    .then(res => res.json())
    .then(result => {
        const submissions = result.data.recentSubmissions;
        if (!submissions || submissions.length === 0) {
            if(!isSilent) alert("未找到提交记录。");
            return;
        }

        const targetSlug = lcDataGlobal.titleSlug;
        
        
        const passed = submissions.find(sub => 
            sub.question.titleSlug === targetSlug && 
            (sub.status === "A_10" || sub.status === "A_ACCEPTED")
        );

        if (passed) {
            console.log("✅ AC Found!", passed);
            markAsSolvedAuto(); 
        } else {
            console.log("❌ Not Found. Target:", targetSlug, "Recent:", submissions.map(s=>s.question.titleSlug));
            if(!isSilent) alert(`验证失败。未检测到 "${targetSlug}" 的通过记录。`);
        }
    })
    .catch(err => {
        console.error(err);
        if(!isSilent) alert("验证 API 请求失败");
    })
    .finally(() => {
        if(checkBtn) {
            checkBtn.innerText = "🔄 Verify Status";
            checkBtn.disabled = false;
        }
    });
}

function markAsSolvedAuto() {
    const today = lcDataGlobal.date;
    const lastSolved = localStorage.getItem(STORAGE_KEY_LAST_DATE);
    
    if (lastSolved === today) {
        closeLeetCodeModal();
        return;
    }

    let streak = parseInt(localStorage.getItem(STORAGE_KEY_STREAK) || '0');
    if (lastSolved) {
        const lastDate = new Date(lastSolved);
        const currDate = new Date(today);
        const diffDays = Math.floor((currDate - lastDate) / (1000 * 60 * 60 * 24)); 
        if (diffDays === 1) streak++;
        else if (diffDays > 1) streak = 1;
    } else {
        streak = 1;
    }

    localStorage.setItem(STORAGE_KEY_LAST_DATE, today);
    localStorage.setItem(STORAGE_KEY_STREAK, streak);

    alert(`验证成功！AC Get! 连续打卡 ${streak} 天 🔥`);
    closeLeetCodeModal();
    showSolvedState();
    updateStreakDisplay();
}

function showSolvedState() {
    document.getElementById('lc-state-todo').style.display = 'none';
    document.getElementById('lc-state-done').style.display = 'block';
    document.getElementById('leetcode-widget').classList.add('status-done');
}

function updateStreakDisplay() {
    const streak = localStorage.getItem(STORAGE_KEY_STREAK) || '0';
    if (parseInt(streak) > 0) {
        document.getElementById('lc-streak-badge').style.display = 'inline';
        document.getElementById('lc-streak-count').innerText = streak;
    }
}

function openLeetCodeModal() {
    if (!lcDataGlobal) return;
    document.getElementById('lc-modal').style.display = 'block';
    document.getElementById('modal-title').innerText = lcDataGlobal.title;
    
    const diffEl = document.getElementById('modal-diff');
    const diffMap = { 'Easy': '简单', 'Medium': '中等', 'Hard': '困难' };
    diffEl.innerText = diffMap[lcDataGlobal.difficulty] || lcDataGlobal.difficulty;
    diffEl.className = `lc-difficulty diff-${lcDataGlobal.difficulty.toLowerCase()}`;
    
    document.getElementById('modal-content').innerHTML = lcDataGlobal.content;

    let codeTemplate = "// C++ snippet not found.";
    if (lcDataGlobal.snippets) {
        const cppSnippet = lcDataGlobal.snippets.find(s => s.langSlug === 'cpp');
        if (cppSnippet) codeTemplate = cppSnippet.code;
    }

    if (!flaskEditor) {
        flaskEditor = new CodeFlask('#code-editor', {
            language: 'clike',
            lineNumbers: true
        });
    }
    flaskEditor.updateCode(codeTemplate);
}

function closeLeetCodeModal() {
    document.getElementById('lc-modal').style.display = 'none';
}

function copyAndGo() {
    const code = flaskEditor.getCode();
    navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.submit-btn');
        btn.innerText = "已复制! 跳转中...";
        setTimeout(() => { 
            btn.innerText = "Copy & Submit 🚀"; 
            window.open("https://leetcode.cn" + lcDataGlobal.link, '_blank');
        }, 1000);
    });
}

document.onkeydown = function(e) {
    if (e.key === "Escape" && document.getElementById('lc-modal').style.display === 'block') {
        closeLeetCodeModal();
    }
}
</script>
</body>

</html>
