# Cloudflare Workers static assets from Hugo output
name = "my-blog"
compatibility_date = "2026-09-11"

[assets]
directory = "./public"
not_found_handling = "404-page"

# Explicit build command — avoids wrangler auto `npx hugo`
# (which fails with: could not determine executable to run)
[build]
command = "npm run build"
